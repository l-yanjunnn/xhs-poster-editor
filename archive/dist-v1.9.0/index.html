<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>小红书排版编辑器</title>

    <!-- 字体策略：
         - 思源黑 / 思源宋：走 fontsource npm 包，在 main.tsx 里 import，由 Vite 打包到本地（大陆友好）
         - ZCOOL / Ma Shan Zheng / Long Cang：仍走 Google Fonts CDN，后续可视情况本地化
         - 本地系统字（PingFang / Songti 等）通过 local() 在 fontPresets 的 font-family stack 中起作用 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&family=ZCOOL+QingKe+HuangYou&family=Long+Cang&display=swap"
    />
    <!-- v1.9.0 字体减重第一刀：包入口 style.css 会 @import 6 份分片
         （regular/light/bold × 常规/mono），应用只用非 mono 的 400/700
         两档，直链需要的两份，砍掉 4 份无用 CSS 与其请求 -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkai-regular.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkai-bold.css"
    />
    <script type="module" crossorigin src="/assets/index-uiqcd8rt.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DAFB0ykm.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
